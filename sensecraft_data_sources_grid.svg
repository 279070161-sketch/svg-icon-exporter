      <polyline points="8 6 2 12 8 18" />
    </g>
    <text x="132.5" y="132" class="label">HTML</text>
  </g>

  <!-- Row 7 -->
  <!-- Card 13: HackerNews -->
  <g transform="translate(20, 1130)">
    <rect width="265" height="165" class="card"/>
    <g transform="translate(110.5, 38) scale(1.8)" class="icon">
