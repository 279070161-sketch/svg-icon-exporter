<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1520" width="100%" height="100%">
  <defs>
    <style>
      .card { fill: #ffffff; stroke: #e2e8f0; stroke-width: 2; rx: 14; ry: 14; filter: drop-shadow(0px 2px 4px rgba(0, 0, 0, 0.02)); }
      .card:hover { stroke: #cbd5e0; }
      .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 20px; font-weight: 500; fill: #2d3748; text-anchor: middle; }
      .icon { fill: none; stroke: #2d3748; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="600" height="1520" fill="#f8fafc"/>

  <!-- Row 1 -->
  <!-- Card 1: Device Sensors -->
  <g transform="translate(20, 20)">
    <rect width="265" height="165" class="card"/>
    <g transform="translate(110.5, 38) scale(1.8)" class="icon">
      <rect x="4" y="4" width="16" height="16" rx="2" />
      <rect x="8" y="8" width="8" height="8" />
      <line x1="1" y1="9" x2="4" y2="9" />
      <line x1="1" y1="15" x2="4" y2="15" />
      <line x1="20" y1="9" x2="23" y2="9" />
      <line x1="20" y1="15" x2="23" y2="15" />
      <line x1="9" y1="1" x2="9" y2="4" />
      <line x1="15" y1="1" x2="15" y2="4" />
      <line x1="9" y1="20" x2="9" y2="23" />
      <line x1="15" y1="20" x2="15" y2="23" />
    </g>
    <text x="132.5" y="132" class="label">Device Sensors</text>
  </g>

  <!-- Card 2: SenseCAP -->
  <g transform="translate(315, 20)">
    <rect width="265" height="165" class="card"/>
    <g transform="translate(110.5, 38) scale(1.8)" class="icon">
      <path d="M5 12.55a11 11 0 0 1 14.08 0" />
      <path d="M1.42 9a16 16 0 0 1 21.16 0" />
      <path d="M8.53 16.11a6 6 0 0 1 6.95 0" />
      <line x1="12" y1="20" x2="12.01" y2="20" />
    </g>
    <text x="132.5" y="132" class="label">SenseCAP</text>
  </g>

  <!-- Row 2 -->
  <!-- Card 3: Weather -->
  <g transform="translate(20, 205)">
    <rect width="265" height="165" class="card"/>
    <g transform="translate(110.5, 38) scale(1.8)" class="icon">
      <path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9z" />
    </g>
    <text x="132.5" y="132" class="label">Weather</text>
  </g>

  <!-- Card 4: Stock -->
  <g transform="translate(315, 205)">
    <rect width="265" height="165" class="card"/>
    <g transform="translate(110.5, 38) scale(1.8)" class="icon">
      <polyline points="23 6 13.5 15.5 8.5 10.5 1 18" />
      <polyline points="17 6 23 6 23 12" />
    </g>
    <text x="132.5" y="132" class="label">Stock</text>
