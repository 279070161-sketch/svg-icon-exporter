    <text x="132.5" y="132" class="label">Google Calendar</text>
  </g>

  <!-- Row 6 -->
  <!-- Card 11: RSS Feed -->
  <g transform="translate(20, 945)">
    <rect width="265" height="165" class="card"/>
    <g transform="translate(110.5, 38) scale(1.8)" class="icon">
      <path d="M4 11a9 9 0 0 1 9 9" />
      <path d="M4 4a16 16 0 0 1 16 16" />
      <circle cx="5" cy="19" r="1" fill="#2d3748" stroke="none" />
    </g>
    <text x="132.5" y="132" class="label">RSS Feed</text>
  </g>

  <!-- Card 12: HTML -->
  <g transform="translate(315, 945)">
    <rect width="265" height="165" class="card"/>
    <g transform="translate(110.5, 38) scale(1.8)" class="icon">
