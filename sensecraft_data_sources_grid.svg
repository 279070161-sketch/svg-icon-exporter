  <!-- Card 5: CoinMarketCap -->
  <g transform="translate(20, 390)">
    <rect width="265" height="165" class="card"/>
    <g transform="translate(110.5, 38) scale(1.8)" class="icon">
      <circle cx="12" cy="12" r="10" />
      <path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8" />
      <line x1="12" y1="6" x2="12" y2="8" />
      <line x1="12" y1="16" x2="12" y2="18" />
    </g>
    <text x="132.5" y="132" class="label">CoinMarketCap</text>
