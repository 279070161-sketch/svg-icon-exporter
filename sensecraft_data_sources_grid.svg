  <g transform="translate(315, 1315)">
    <rect width="265" height="165" class="card"/>
    <g transform="translate(110.5, 28) scale(1.8)" class="icon">
      <path d="M16 16l-4-4-4 4" />
      <path d="M12 12v9" />
      <path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3" />
    </g>
    <text x="132.5" y="124" class="label">Push to</text>
