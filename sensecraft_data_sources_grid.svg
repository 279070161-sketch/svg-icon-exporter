      <path d="M7 6l5 7v5h2v-5l5-7h-2.5L13 11.5 9.5 6H7z" />
    </g>
    <text x="132.5" y="132" class="label">HackerNews</text>
  </g>

  <!-- Card 14: Reddit -->
  <g transform="translate(315, 1130)">
    <rect width="265" height="165" class="card"/>
    <g transform="translate(110.5, 38) scale(1.8)" class="icon">
      <circle cx="12" cy="12" r="9" />
      <circle cx="12" cy="12" r="3" />
      <circle cx="8" cy="10" r="1" fill="#2d3748" stroke="none" />
      <circle cx="16" cy="10" r="1" fill="#2d3748" stroke="none" />
      <path d="M9 15c1 1 5 1 6 0" />
    </g>
    <text x="132.5" y="132" class="label">Reddit</text>
  </g>

  <!-- Row 8 -->
  <!-- Card 15: External Data Source -->
  <g transform="translate(20, 1315)">
    <rect width="265" height="165" class="card"/>
    <g transform="translate(110.5, 28) scale(1.8)" class="icon">
      <ellipse cx="12" cy="5" rx="9" ry="3" />
      <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3" />
      <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5" />
