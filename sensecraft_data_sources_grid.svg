  <g transform="translate(315, 575)">
    <rect width="265" height="165" class="card"/>
    <g transform="translate(110.5, 38) scale(1.8)" class="icon">
      <path d="M3 21c3 0 7-1 7-8V5c0-1.25-.75-2-2-2H4c-1.25 0-2 .75-2 2v6c0 1.25.75 2 2 2h3c0 4-3 6-4 6zm11 0c3 0 7-1 7-8V5c0-1.25-.75-2-2-2h-4c-1.25 0-2 .75-2 2v6c0 1.25.75 2 2 2h3c0 4-3 6-4 6z" />
    </g>
    <text x="132.5" y="132" class="label">ZenQuotes</text>
  </g>

